<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - CyberSnap</title>
<style>
  .error-message {
    color: #ff6b81;
    background: rgba(255, 50, 90, 0.1);
    border: 1px solid #ff6b81;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
}
  :root {
    --bg: #0c0714;
    --card-bg: rgba(20, 12, 32, 0.7);
    --border: rgba(168, 116, 255, 0.2);
    --border-focus: rgba(236, 72, 153, 0.55);
    --text: #f3eefc;
    --text-dim: #9c8db3;
    --accent-1: #a855f7;
    --accent-2: #ec4899;
    --ring: rgba(168, 85, 247, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, "Segoe UI", "Inter", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 40px 24px;
    background:
      radial-gradient(ellipse 80% 60% at 30% 45%, rgba(168,85,247,0.16), transparent 65%),
      var(--bg);
  }

  .seam {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(168,85,247,0.35), transparent);
    height: 1px;
    z-index: 0;
  }
  .seam.s1 { width: 40%; top: 18%; left: 0; transform: rotate(8deg); }
  .seam.s2 { width: 30%; bottom: 14%; left: 4%; transform: rotate(-6deg); }
  .seam.s3 { width: 26%; top: 65%; right: 6%; transform: rotate(10deg); }

  .stage-inner {
    position: relative;
    width: 100%;
    max-width: 1120px;
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    align-items: center;
    gap: 20px;
    z-index: 1;
  }

  .cluster {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--ring);
  }
  .ring.r1 { width: 92%; height: 92%; border-color: rgba(168,85,247,0.15); }
  .ring.r2 { width: 68%; height: 68%; border-color: rgba(168,85,247,0.28); }
  .ring.r3 { width: 44%; height: 44%; border: 1.5px solid rgba(236,72,153,0.45); }

  .center-shield {
    position: relative;
    width: 34%;
    height: 34%;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: linear-gradient(160deg, rgba(168,85,247,0.25), rgba(236,72,153,0.12));
    box-shadow: 0 0 70px rgba(168,85,247,0.45), inset 0 0 30px rgba(236,72,153,0.15);
  }

  .center-shield svg { width: 46%; height: 46%; }

  .node {
    position: absolute;
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: rgba(20, 12, 32, 0.85);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(168, 85, 247, 0.18);
  }
  .node svg { width: 22px; height: 22px; stroke: var(--accent-2); }

  .node.n-top    { top: -2%;  left: 50%; transform: translate(-50%, 0); }
  .node.n-right  { top: 26%;  right: -4%; }
  .node.n-bottom-r { bottom: 6%; right: 8%; }
  .node.n-bottom-l { bottom: 6%; left: 8%; }
  .node.n-left   { top: 26%;  left: -4%; }

  .cluster-caption {
    position: absolute;
    bottom: -54px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    max-width: 280px;
    line-height: 1.6;
  }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 34px 30px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
  }

  .card-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .card-brand .mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-brand .mark svg { width: 15px; height: 15px; }
  .card-brand span { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }

  .card h2 { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .card .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

  form { display: flex; flex-direction: column; gap: 14px; }

  .field label {
    display: block;
    font-size: 12.5px;
    color: #cdbfe3;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .field .input-wrap { position: relative; border-radius: 9px; transition: box-shadow 0.15s ease; }

  .field .input-wrap:focus-within {
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25), 0 0 18px rgba(168, 85, 247, 0.35);
    border-radius: 9px;
  }

  .field .input-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: #7c6a94;
  }

  .field input {
    width: 100%;
    padding: 11px 14px 11px 36px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .field input::placeholder { color: #6b5d81; }

  .field input:focus {
    border-color: var(--border-focus);
    background: rgba(236, 72, 153, 0.06);
  }

  /* ---- Password eye toggle ---- */
  .field input.has-toggle { padding-right: 40px; }

  .toggle-pw {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    color: #7c6a94;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .toggle-pw:hover { color: var(--accent-2); background: rgba(255,255,255,0.05); }
  .toggle-pw:focus-visible { outline: 2px solid var(--accent-2); }

  /* override the generic ".input-wrap svg" rule (left-positioned icon) */
  .field .input-wrap .toggle-pw svg {
    position: static;
    transform: none;
    width: 17px;
    height: 17px;
    stroke: currentColor;
  }
  .toggle-pw .eye-off { display: none; }
  .toggle-pw.showing .eye { display: none; }
  .toggle-pw.showing .eye-off { display: block; }

  .submit-btn {
    margin-top: 4px;
    padding: 12px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .submit-btn:hover { filter: brightness(1.08); }
  .submit-btn:active { transform: scale(0.99); }

  .switch-line {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
  }
  .switch-line a { color: #e5a3ff; text-decoration: none; font-weight: 600; }
  .switch-line a:hover { text-decoration: underline; }

  @media (max-width: 860px) {
    .stage-inner { grid-template-columns: 1fr; justify-items: center; gap: 64px; }
    .cluster { max-width: 320px; }
    .card { width: 100%; max-width: 400px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="seam s1"></div>
  <div class="seam s2"></div>
  <div class="seam s3"></div>

  <div class="stage-inner">

    <div class="cluster">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>

      <div class="center-shield">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3z" stroke="#e9b8ff"/>
          <rect x="9" y="11" width="6" height="5" rx="1" stroke="#ec4899"/>
          <path d="M10.3 11V9.3a1.7 1.7 0 0 1 3.4 0V11" stroke="#ec4899"/>
        </svg>
      </div>

      <div class="node n-top">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
      </div>
      <div class="node n-right">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="node n-bottom-r">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="node n-bottom-l">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a9.5 9.5 0 0 0 19 0"/><path d="M2 12a9.5 9.5 0 0 1 19 0"/><path d="M9 12h.01M15 12h.01"/></svg>
      </div>
      <div class="node n-left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92V19a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.06 3.18 2 2 0 0 1 4.11 1h2.09a2 2 0 0 1 2 1.72c.12.9.32 1.78.6 2.63a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.45-1.27a2 2 0 0 1 2.11-.45c.85.28 1.73.48 2.63.6a2 2 0 0 1 1.72 2.02z"/></svg>
      </div>

      <p class="cluster-caption">Your trusted screenshot privacy layer — scanned locally before you ever hit share.</p>
    </div>

    <div class="card">
      <div class="card-brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3z"/>
          </svg>
        </div>
        <span>CyberSnap</span>
      </div>

      <h2>Create your account</h2>
      <p class="sub">Start protecting your screenshots in minutes.</p>
      {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
{% endif %}

      <form method="POST">
        <div style="display:none">{% csrf_token %}</div>

        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" class="has-toggle" placeholder="Create a password" required>
            <button type="button" class="toggle-pw" aria-label="Show password" data-target="password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirm_password" name="confirm_password" class="has-toggle" placeholder="Re-enter your password" required>
            <button type="button" class="toggle-pw" aria-label="Show password" data-target="confirm_password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.1 10.1 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Create account</button>
      </form>

      <p class="switch-line">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>

  </div>
</div>

<script>
  document.querySelectorAll('.toggle-pw').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('showing', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
</script>

</body>
</html>
